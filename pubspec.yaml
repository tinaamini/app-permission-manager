name: Privio
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.7+7

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.9.3
  go_router: ^12.1.3
  flutter_bloc: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0


flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/main/
    - assets/fonts/
    - assets/app_permission/
    - assets/group_permission/
    - assets/special_permission/
    - assets/dashboard/
    - assets/utils/
    - assets/logo/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

    - family: Shabnam
      fonts:
        - asset: assets/fonts/Vazir-Thin-FD-WOL.ttf
          weight: 300

        - asset: assets/fonts/Vazir-Light-FD-WOL.ttf
          weight: 400

        - asset: assets/fonts/Vazir-Medium-FD-WOL.ttf
          weight: 500

        - asset: assets/fonts/Vazir-Bold-FD-WOL.ttf
          weight: 600

        - asset: assets/fonts/Vazir-Bold-FD-WOL.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/logo/logo.png"

  adaptive_icon_foreground: "assets/logo/logo.png"
  adaptive_icon_background: "#0D0D0D"

  min_sdk_android: 21


flutter_native_splash:
  color: "#0D0D0D"
  color_dark: "#0D0D0D"
  image: assets/logo/logo_transparent.png
  android: true
  ios: true
  web: true

  android_12:
    color: "#0D0D0D"
    color_dark: "#0D0D0D"
    image: assets/logo/logo_transparent.png
